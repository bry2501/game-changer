<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050505" />
    <title>Ghost Mystery</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #050505; overflow: hidden; }
      #game { width: 100vw; height: 100vh; }
    </style>
    <script type="module" crossorigin src="./assets/index-umnNNwJO.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <script>
      // GitHub Pages "Deploy from a branch" serves this raw source page, which cannot run
      // TypeScript. In that case jump to the pre-built copy of the game in docs/.
      (function () {
        if (document.querySelector('script[src$="main.ts"]') && /github\.io$/.test(location.hostname)) {
          location.replace('docs/' + location.search);
        }
      })();
      // Never leave players on a silent black screen: explain if the game failed to start.
      setTimeout(function () {
        if (document.querySelector('#game canvas')) return;
        var m = document.createElement('div');
        m.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;' +
          'text-align:center;padding:24px;color:#dddddd;font:18px Georgia,serif;background:#050505;z-index:5';
        m.textContent = 'The ghost could not wake up: the game failed to load. Try reloading the page.';
        document.body.appendChild(m);
      }, 10000);
    </script>
  </body>
</html>
