<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Ghost Mystery</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #05060a; overflow: hidden; touch-action: none; }
      #game { width: 100vw; height: 100vh; height: 100dvh; }
      #rotate { display: none; position: fixed; inset: 0; color: #cfd8ff; font: 18px Georgia, serif;
        align-items: center; justify-content: center; text-align: center; background: #05060a; z-index: 10; padding: 16px; }
      @media (orientation: portrait) and (max-width: 700px) { #rotate { display: flex; } }
    </style>
    <script type="module" crossorigin src="./assets/index-6ymZ_i9m.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Turn your phone sideways to haunt properly.</div>
    <script>
      // GitHub Pages "Deploy from a branch" serves this raw source page, which cannot run
      // TypeScript. In that case jump to the pre-built copy of the game in docs/.
      (function () {
        if (document.querySelector('script[src$="main.ts"]') && /github\.io$/.test(location.hostname)) {
          location.replace('docs/' + location.search);
        }
      })();
      // Never leave players on a silent black screen: explain if the game failed to start.
      setTimeout(function () {
        if (document.querySelector('#game canvas')) return;
        var m = document.createElement('div');
        m.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;' +
          'text-align:center;padding:24px;color:#cfd8ff;font:18px Georgia,serif;background:#05060a;z-index:5';
        m.textContent = 'The ghost could not wake up: the game failed to load. Try reloading the page.';
        document.body.appendChild(m);
      }, 10000);
    </script>
  </body>
</html>
