name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/beautiful-tesla-mhfie3]
  workflow_dispatch:

permissions:
  contents: write # to commit the rebuilt docs/ copy after a text edit made on GitHub
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # A text edit made in GitHub's web editor changes the source but not the built copy in
      # docs/ (which GitHub's branch deployment serves). Rebuild it and, if it changed, commit it
      # back. Pushes made with the workflow's own token don't start this workflow again.
      - name: Rebuild the docs/ copy and commit it if it changed
        run: |
          npm run build:pages
          if ! git diff --quiet -- docs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "Rebuild docs/ after a web edit"
            git push origin HEAD:${{ github.ref_name }}
          fi
      # GitHub's branch deployment serves the repo, where the game lives under docs/.
      # Publish the same paths here too (the game at the root and under docs/), so
      # every link works whichever deployment finishes last.
      - name: Lay out the site
        run: mkdir -p site && cp -r dist/. site/ && cp -r dist site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
