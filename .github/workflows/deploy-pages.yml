name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/beautiful-tesla-mhfie3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check the committed docs/ copy is up to date
        run: npm run build:pages && git diff --exit-code -- docs || (echo '::error::docs/ is stale. Run npm run build:pages and commit.' && exit 1)
      # GitHub's branch deployment serves the repo, where the game lives under docs/.
      # Publish the same paths here too (the game at the root and under docs/), so
      # every link works whichever deployment finishes last.
      - name: Lay out the site
        run: mkdir -p site && cp -r dist/. site/ && cp -r dist site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
